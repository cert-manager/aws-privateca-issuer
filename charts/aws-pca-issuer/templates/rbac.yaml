{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aws-privateca-issuer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-privateca-issuer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aws-privateca-issuer.fullname" . }}
  labels:
    {{- include "aws-privateca-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
      - coordination.k8s.io
    resources:
      - configmaps
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  {{- if .Values.enableLegacySecretCredentials }}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  {{- end }}
  - apiGroups:
      - awspca.cert-manager.io
    resources:
      - awspcaclusterissuers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - awspca.cert-manager.io
    resources:
      - awspcaclusterissuers/finalizers
    verbs:
      - update
  - apiGroups:
      - awspca.cert-manager.io
    resources:
      - awspcaclusterissuers/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - awspca.cert-manager.io
    resources:
      - awspcaissuers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - awspca.cert-manager.io
    resources:
      - awspcaissuers/finalizers
    verbs:
      - update
  - apiGroups:
      - awspca.cert-manager.io
    resources:
      - awspcaissuers/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - cert-manager.io
    resources:
      - certificaterequests
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - certificaterequests/status
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aws-privateca-issuer.fullname" . }}
  labels:
    {{- include "aws-privateca-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aws-privateca-issuer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aws-privateca-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- $fullname := include "aws-privateca-issuer.fullname" . }}
{{- $controllerSA := include "aws-privateca-issuer.serviceAccountName" . }}
{{- $tokenRequests := list }}
{{- if .Values.enableLegacyControllerServiceAccountToken }}
{{- $tokenRequests = append $tokenRequests (dict "namespace" .Release.Namespace "name" $controllerSA "suffix" "tokenrequest") }}
{{- end }}
{{- range $i, $sa := .Values.serviceAccountTokenRequests }}
{{- if not (and $sa.namespace $sa.name) }}
{{- fail (printf "serviceAccountTokenRequests[%d] must set namespace and name" $i) }}
{{- end }}
{{- $tokenRequests = append $tokenRequests (dict "namespace" $sa.namespace "name" $sa.name "suffix" (printf "tokenrequest-%s" $sa.name)) }}
{{- end }}
{{- range $tokenRequests }}
# Lets the controller request tokens for the ServiceAccount {{ .namespace }}/{{ .name }}, for issuers whose serviceAccountRef names it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s" $fullname .suffix | trunc 63 | trimSuffix "-" }}
  namespace: {{ .namespace }}
  labels:
    {{- include "aws-privateca-issuer.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ .name | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" $fullname .suffix | trunc 63 | trimSuffix "-" }}
  namespace: {{ .namespace }}
  labels:
    {{- include "aws-privateca-issuer.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s" $fullname .suffix | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $controllerSA }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- end }}
{{- if .Values.approverRole.enabled -}}
# permissions to approve all awspca.cert-manager.io requests
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{.Values.approverRole.serviceAccountName}}-controller-approve:awspca-cert-manager-io
  labels:
    {{- include "aws-privateca-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups:
    - cert-manager.io
    resources:
    - signers
    verbs:
    - approve
    resourceNames:
    - awspcaclusterissuers.awspca.cert-manager.io/*
    - awspcaissuers.awspca.cert-manager.io/*
---
# bind the approver ServiceAccount to approve all awspca.cert-manager.io
# CertificateRequests
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{.Values.approverRole.serviceAccountName}}-controller-approve:awspca-cert-manager-io
  labels:
    {{- include "aws-privateca-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{.Values.approverRole.serviceAccountName}}-controller-approve:awspca-cert-manager-io
subjects:
- kind: ServiceAccount
  name: {{ .Values.approverRole.serviceAccountName }}
  namespace: {{ .Values.approverRole.namespace }}
{{- end }}
